name: Recovery object metadata
on:
  push:
    branches: [sync/r01-r06-20261002]
    paths: [.github/workflows/recovery-metadata.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            fs.mkdirSync('recovery-object-bytes', {recursive:true});
            const shas = ['4ef78f7aab0c247d375246d49782900833b51953','091f0d93b0d8cb59f1ea56fc511d135b3ad60508','65a42021c6fb97faf113616de709d8f548dfa5f5','e0cec51802a117c07c7f2743c7995ac4b5502c77','41824cd30743af79f6135acd31ece0e9cab8592f','56642f8507e2c910d61e3c3b0c7b7b8dc964a704','02092f1f3518f585e3c875b91c587a096fe4cf5c','19519cecc0375446378c62c1682a33ddfdb2f99f','25e6e0139b8cb402605e63ac04ce95f39f1300cc','1f3e5205a7bc075c7d18180e94ba04d84c17993c','f5e88bcbbe735ef01a83729d0c618ca675625412','b31b72d9e54ddcf8a29a1ec7a04dcf5fc72d316f','2af20fe486b05674373d4838d197029e59316d04'];
            const rows = [];
            for (const file_sha of shas) {
              const {data} = await github.rest.git.getBlob({...context.repo, file_sha});
              if (data.encoding !== 'base64' || data.size > 20000) throw new Error('Unexpected object format');
              const bytes = Buffer.from(data.content, 'base64');
              const hash = crypto.createHash('sha1').update(Buffer.from('blob '+bytes.length+'\0')).update(bytes).digest('hex');
              if (hash !== file_sha) throw new Error('Git object checksum mismatch');
              fs.writeFileSync('recovery-object-bytes/'+file_sha+'.bin',bytes);
              const row = {sha:data.sha,size:data.size,sha256:crypto.createHash('sha256').update(bytes).digest('hex')};
              rows.push(row);core.info(JSON.stringify(row));
            }
            fs.writeFileSync('recovery-object-bytes/metadata.json',JSON.stringify(rows,null,2));
      - uses: actions/upload-artifact@v4
        with:
          name: original-recovery-objects
          path: recovery-object-bytes/
          retention-days: 7
          if-no-files-found: error
