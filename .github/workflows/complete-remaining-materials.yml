name: Complete remaining materials and audit originals
on:
  push:
    branches: [sync/r01-r06-20261002]
    paths:
      - .github/workflows/complete-remaining-materials.yml
      - tools/complete_remaining_materials.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legeandre-material-completion
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/r01-r06-20261002
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install historical embroidery and report tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install numpy==2.3.5 Pillow==12.3.0 shapely==2.1.2 reportlab==4.4.9 opencv-python-headless PyMuPDF
      - name: Recover missing materials, verify originals and publish individual files
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python tools/complete_remaining_materials.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-completion-audit
          path: |
            provenance/REMAINING_FILES_AUDIT.json
            provenance/REMAINING_ORIGINALS.md
            provenance/completion_previews/
          if-no-files-found: warn
          retention-days: 7
